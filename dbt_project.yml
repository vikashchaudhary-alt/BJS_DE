name: bjs_de
version: 1.0.0
config-version: 2

profile: bjs_de

require-dbt-version:
  - ">=1.10.0"
  - "<2.0.0"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]

target-path: target
clean-targets:
  - target
  - dbt_packages

on-run-start:
  - "{{ create_audit_schema() }}"
  - "{{ create_model_run_audit_table() }}"

on-run-end:
  - "{{ log_model_run_results(results) }}"

# Cloud environments can provide these values as DBT_* environment variables.
# CLI --vars values take precedence, which lets Airflow supply per-run lineage.
vars:
  source_lineage_id: "{{ env_var('DBT_SOURCE_LINEAGE_ID', 'null') | as_native }}"
  lineage_id: "{{ env_var('DBT_LINEAGE_ID', 'null') | as_native }}"
  load_id: "{{ env_var('DBT_LOAD_ID', 'null') | as_native }}"
  loop_id: "{{ env_var('DBT_LOOP_ID', 'null') | as_native }}"
  run_id: "{{ env_var('DBT_RUN_ID', 'null') | as_native }}"
  procedure_id: "{{ env_var('DBT_PROCEDURE_ID', 'null') | as_native }}"

models:
  bjs_de:
    +database: "{{ env_var('DBT_TARGET_DATABASE', 'DBT_DEV') }}"
    +persist_docs:
      relation: true
      columns: true
