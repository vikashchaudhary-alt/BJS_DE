name: bjs_de
version: 1.0.0
config-version: 2

profile: bjs_de

require-dbt-version:
  - ">=1.10.0"
  - "<2.0.0"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]

target-path: target
clean-targets:
  - target
  - dbt_packages

on-run-start:
  - "{{ create_audit_schema() }}"
  - "{{ create_model_run_audit_table() }}"

on-run-end:
  - "{{ log_model_run_results(results) }}"

# DBT_ENVIRONMENT is the only environment selector. Database names follow the
# project's Bronze/Silver convention:
#   dev  -> DEV_BRONZE / DEV_SILVER
#   qa   -> QA_BRONZE  / QA_SILVER
#   prod -> PROD_BRONZE / PROD_SILVER
# CLI --vars values take precedence for per-run lineage metadata.
vars:
  source_lineage_id: "{{ env_var('DBT_SOURCE_LINEAGE_ID', 'null') | as_native }}"
  lineage_id: "{{ env_var('DBT_LINEAGE_ID', 'null') | as_native }}"
  load_id: "{{ env_var('DBT_LOAD_ID', 'null') | as_native }}"
  loop_id: "{{ env_var('DBT_LOOP_ID', 'null') | as_native }}"
  run_id: "{{ env_var('DBT_RUN_ID', 'null') | as_native }}"
  procedure_id: "{{ env_var('DBT_PROCEDURE_ID', 'null') | as_native }}"

models:
  bjs_de:
    +database: "{{ env_var('DBT_ENVIRONMENT') | upper }}_SILVER"
    +persist_docs:
      relation: true
      columns: true
