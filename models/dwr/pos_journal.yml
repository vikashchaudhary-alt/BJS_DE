version: 2

models:
  - name: pos_journal
    description: >-
      dbt replacement for the POSJOURNAL DWR stage/delete/insert procedure family.
      Incremental runs replace complete BusinessDate and SiteId partitions.
    columns:
      - name: BusinessDate
        description: POS business date and first component of the replacement key.
        tests:
          - not_null
      - name: SiteId
        description: Site identifier and second component of the replacement key.
        tests:
          - not_null
      - name: JournalAccountId
        description: Canonical account ID, or -1 when no matching reference row exists.
        tests:
          - not_null
      - name: CreditAmount
        description: Credit amount from the source journal row.
      - name: DebitAmount
        description: Debit amount from the source journal row.
      - name: SourceLineageId
        description: Lineage ID assigned by the source-load procedure.
        tests:
          - not_null
      - name: LineageId
        description: DWR lineage ID supplied for the run or inherited from the source.
        tests:
          - not_null
      - name: LoadId
        description: DWR load ID supplied for the run or inherited from the source.
      - name: LoopId
        description: Legacy orchestration loop ID; defaults to -1.
        tests:
          - not_null
      - name: RunId
        description: Legacy orchestration run ID; defaults to -1.
        tests:
          - not_null
      - name: ProcedureId
        description: Legacy procedure ID; defaults to -1 for dbt execution.
        tests:
          - not_null
      - name: DbtInvocationId
        description: UUID generated by dbt for the command that produced the row.
        tests:
          - not_null
      - name: DbtRunStartedAt
        description: UTC timestamp at which the producing dbt command started.
        tests:
          - not_null
      - name: InsertDateTime
        description: Timestamp at which the row was inserted by the dbt run.
        tests:
          - not_null
      - name: UpdateDateTime
        description: Timestamp at which the row was last produced by the dbt run.
        tests:
          - not_null
