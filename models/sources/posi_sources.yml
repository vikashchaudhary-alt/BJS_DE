version: 2

sources:
  - name: src_posi
    description: Persisted POSI source records produced by the existing source-load procedures.
    database: "{{ env_var('DBT_SRC_POSI_DATABASE', 'SRCPOSIDB_DEV') }}"
    schema: DBO
    tables:
      - name: posi_journal
        identifier: POSIJOURNAL
        description: POS journal records parsed from JOURNAL.DBF by the existing source procedure.
        columns:
          - name: BUSINESSDATE
            description: POS business date.
            tests:
              - not_null
          - name: SITEID
            description: Restaurant/site identifier.
            tests:
              - not_null
          - name: LINEAGEID
            description: Source-load lineage identifier.
            tests:
              - not_null
          - name: LOADID
            description: Source-load identifier.

  - name: dwr_reference
    description: Existing DWR reference data required by the pilot transformation.
    database: "{{ env_var('DBT_DWR_REFERENCE_DATABASE', 'DWRDB_DEV') }}"
    schema: DBO
    tables:
      - name: journal_account
        identifier: JOURNALACCOUNT
        description: Maps POSI journal account identity to the canonical DWR journal account ID.
      - name: site_business_date
        identifier: SITEBUSINESSDATE
        description: Identifies valid open business dates for each site.
